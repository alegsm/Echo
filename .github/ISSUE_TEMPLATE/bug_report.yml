name: Bug report
description: Something in Echo does not work as described in the README.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/alegsm/Echo/issues?q=is%3Aissue) first. Report security problems privately through [Report a vulnerability](https://github.com/alegsm/Echo/security/advisories/new), not here.

        Issues are public. Replace API keys, transcripts, prompts and file paths that show your name with `<redacted>`.
  - type: input
    id: version
    attributes:
      label: Echo version
      description: Shown at the bottom of the sidebar.
      placeholder: "0.5.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 26.1, Windows 11 24H2, Ubuntu 24.04 on Wayland"
  - type: dropdown
    id: provider
    attributes:
      label: Transcription provider
      description: Settings > Provider.
      options:
        - Groq
        - OpenAI
        - xAI
        - ElevenLabs
        - Deepgram
        - Mistral
        - Not related to a provider
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Hold Fn and say "..."
        2. Release
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include any error message Echo showed.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: Optional. Turn on Settings > Debug log, reproduce the problem, then paste the relevant lines from `Echo.log`. Settings > Debug log shows where the file is. The log excludes audio, transcripts, prompts and credentials.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed keys, transcripts and other private details from this report.
          required: true
